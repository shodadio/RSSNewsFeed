<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress and intercept Vite WebSocket HMR disconnects in iframe development environment
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (
              urlStr.indexOf('vite') !== -1 ||
              urlStr.indexOf('/@vite') !== -1 ||
              urlStr.indexOf('ws:') !== -1 ||
              urlStr.indexOf('wss:') !== -1
            ) {
              var listeners = {};
              return {
                readyState: 1, // WebSocket.OPEN
                send: function() {},
                close: function() {},
                addEventListener: function(type, cb) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(cb);
                  if (type === 'open') {
                    setTimeout(function() { try { cb({}); } catch (e) {} }, 0);
                  }
                },
                removeEventListener: function(type, cb) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(fn) { return fn !== cb; });
                  }
                }
              };
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason ? event.reason.message || String(event.reason) : '');
          if (
            reason && (
              reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('vite') !== -1 ||
              reason.indexOf('ws:') !== -1 ||
              reason.indexOf('closed without opened') !== -1
            )
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || '');
          if (
            msg && (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('vite') !== -1 ||
              msg.indexOf('closed without opened') !== -1
            )
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
